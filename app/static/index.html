<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR Seven Segment — MVP</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>OCR Seven Segment</h1>
  <nav><a href="/">Ambil &amp; Label</a> · <a href="/summary">Ringkasan Data</a> · <a href="/docs">API</a></nav>
</header>

<main>
<section class="card">
  <h2>1. Foto</h2>
  <input id="file" type="file" accept="image/*" capture="environment">
  <p class="hint">Di HP, tombol ini membuka kamera belakang. Seret di gambar untuk memilih ROI (area display).</p>
  <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
  <div class="row">
    <label>x <input id="roi_x" type="number" value="0" min="0"></label>
    <label>y <input id="roi_y" type="number" value="0" min="0"></label>
    <label>w <input id="roi_w" type="number" value="0" min="0"></label>
    <label>h <input id="roi_h" type="number" value="0" min="0"></label>
    <button id="roiReset" type="button">Reset ROI</button>
  </div>
</section>

<section class="card">
  <h2>2. Preprocessing</h2>
  <div class="row">
    <label><input id="grayscale" type="checkbox" checked> Grayscale</label>
    <label><input id="clahe" type="checkbox"> CLAHE</label>
    <label>clip <input id="clahe_clip" type="number" value="2.0" step="0.5" min="0.5"></label>
    <label>Blur <input id="blur" type="number" value="0" min="0" max="15"></label>
    <label>Tinggi target <input id="target_height" type="number" value="0" min="0" title="0 = tanpa resize"></label>
  </div>
  <div class="row">
    <label>Threshold
      <select id="threshold">
        <option value="none">none</option><option value="otsu">otsu</option>
        <option value="adaptive">adaptive</option><option value="fixed">fixed</option>
      </select></label>
    <label>nilai <input id="threshold_value" type="number" value="127" min="0" max="255"></label>
    <label><input id="invert" type="checkbox"> Invert</label>
    <label title="menebalkan teks gelap agar celah antar-segmen menyatu">Tebalkan segmen <input id="dilate" type="number" value="0" min="0" max="5"></label>
    <button id="btnPreview" type="button">Pratinjau</button>
  </div>
  <img id="preview" alt="pratinjau" class="preview">
  <p id="previewInfo" class="hint"></p>
</section>

<section class="card">
  <h2>3. OCR</h2>
  <div class="row">
    <label>Engine <select id="engine"></select></label>
    <button id="btnPredict" type="button" class="primary">Jalankan OCR</button>
  </div>
  <div id="result" class="result"></div>
</section>

<section class="card">
  <h2>4. Koreksi label &amp; simpan</h2>
  <div class="row">
    <label>Label benar <input id="label" inputmode="decimal" pattern="[0-9.]+" placeholder="mis. 123.4"></label>
    <label>Alat <input id="device" placeholder="mis. timbangan_A / meteran_listrik"></label>
    <label>Cahaya <select id="lighting"></select></label>
    <label>Sesi <input id="session" placeholder="mis. S01_2026-11-05"></label>
  </div>
  <div class="row"><label class="grow">Catatan <input id="notes" class="grow" placeholder="opsional"></label></div>
  <button id="btnSave" type="button" class="primary" disabled>Simpan ke labels.csv</button>
  <p id="saveInfo" class="hint"></p>
</section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
